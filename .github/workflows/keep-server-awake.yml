# Keeps the free Render game server awake: Render puts a free service to
# sleep after 15 minutes without traffic and it then takes about a minute to
# wake, which a player would feel as a long "connecting...". One request to
# /healthz every 10 minutes is enough, and one always-on service fits in the
# free 750 hours a month.
#
# The server's address comes from the repository variable GAME_SERVER_URL
# (Settings > Secrets and variables > Actions > Variables), e.g.
# https://linotte-web.onrender.com. Without it, this job does nothing.
# On a paid Render plan the server never sleeps and this job can be removed.
#
# It is also the alarm: if the server does not answer, or its game answer is wrong, the run fails and GitHub
# emails the person who owns the schedule (a failed scheduled workflow is mailed by default; check Settings >
# Notifications > Actions on GitHub that "Send notifications for failed workflows only" is on).
name: Keep game server awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /healthz
        env:
          URL: ${{ vars.GAME_SERVER_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "GAME_SERVER_URL is not set; nothing to ping."
            exit 0
          fi
          # Up to ~90s: a sleeping server takes about a minute to answer.
          health=$(curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 5 "$URL/healthz")
          echo "$health"
          echo "$health" | grep -q '"ok":true' || { echo "::error::/healthz did not say ok"; exit 1; }
          # The account and game side too (it reads the database): a server that is up but can't do its job.
          curl --fail --silent --show-error --max-time 60 --retry 2 --retry-delay 5 -o /dev/null "$URL/api/me" || { echo "::error::/api/me failed"; exit 1; }
