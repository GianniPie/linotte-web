# Keeps the free Render game server awake: Render puts a free service to
# sleep after 15 minutes without traffic and it then takes about a minute to
# wake, which a player would feel as a long "connecting...". One request to
# /healthz every 10 minutes is enough, and one always-on service fits in the
# free 750 hours a month.
#
# The server's address comes from the repository variable GAME_SERVER_URL
# (Settings > Secrets and variables > Actions > Variables), e.g.
# https://linotte-web.onrender.com. Without it, this job does nothing.
# On a paid Render plan the server never sleeps and this job can be removed.
name: Keep game server awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /healthz
        env:
          URL: ${{ vars.GAME_SERVER_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "GAME_SERVER_URL is not set; nothing to ping."
            exit 0
          fi
          # Up to ~90s: a sleeping server takes about a minute to answer.
          curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 5 "$URL/healthz"
