<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Linotte</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- The app lives in public/. Hosts that serve the repo root (GitHub Pages)
         land here, so send them on; the relative path keeps working under a
         sub-path like /linotte-web/. -->

    <link rel="canonical" href="public/">
    <script>location.replace("public/" + location.search + location.hash);</script>
</head>
<body>
    <p><a href="public/">Open Linotte</a></p>
</body>
</html>
