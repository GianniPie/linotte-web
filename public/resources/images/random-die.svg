<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- "Random piece" in the options: a die in 3D, flat colours, the three
       visible faces showing 1, 2 and 3. -->
  <g stroke="#3d240c" stroke-width="3" stroke-linejoin="round">
    <path d="M50 10 L86 30 L50 50 L14 30 Z" fill="#ffffff"/>
    <path d="M14 30 L50 50 L50 92 L14 72 Z" fill="#e9dccb"/>
    <path d="M86 30 L86 72 L50 92 L50 50 Z" fill="#cdb79c"/>
  </g>
  <g fill="#3d240c">
    <!-- top: 1 -->
    <ellipse cx="50" cy="30" rx="6" ry="3.6"/>
    <!-- left: 2 -->
    <ellipse cx="23.5" cy="45" rx="4" ry="5" transform="rotate(-8 23.5 45)"/>
    <ellipse cx="40.5" cy="77" rx="4" ry="5" transform="rotate(-8 40.5 77)"/>
    <!-- right: 3 -->
    <ellipse cx="59.5" cy="77" rx="4" ry="5" transform="rotate(8 59.5 77)"/>
    <ellipse cx="68" cy="61" rx="4" ry="5" transform="rotate(8 68 61)"/>
    <ellipse cx="76.5" cy="45" rx="4" ry="5" transform="rotate(8 76.5 45)"/>
  </g>
</svg>
