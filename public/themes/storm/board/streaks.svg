  <defs>
    <linearGradient id="streak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".1"/>
    </linearGradient>
  </defs>
  <path d="M81.36 67.80v6.29" stroke="url(#streak)" stroke-width=".5" stroke-linecap="round"/>
  <path d="M41.43 56.04v8.89" stroke="url(#streak)" stroke-width=".5" stroke-linecap="round"/>
