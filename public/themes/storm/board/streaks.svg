<?xml version="1.0" encoding="UTF-8"?>
<!-- The runs of water on the storm board, still. The drops are elements of their own (syncBoardDrops in linotte.js: they slide away when a piece lands on their tile), and the ones that slide now and then too (rainOnce). -->
