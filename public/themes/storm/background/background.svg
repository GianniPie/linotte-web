<?xml version="1.0" encoding="UTF-8"?>
<!-- Storm background, the still part: the sky (grey-blues) with a pale glow at the top, a few still clouds (so a sky without its moving clouds is not one flat blue) and a soft shade at the bottom. Everything that moves is drawn apart and moved by the GPU (storm-fx-*.svg, .bg-fx in linotte.css): an animation inside a background picture is redrawn by the CPU at every frame. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice" width="100%" height="100%">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33486c"/>
      <stop offset=".5" stop-color="#273b5b"/>
      <stop offset="1" stop-color="#1a2a44"/>
    </linearGradient>
    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1424" stop-opacity="0"/>
      <stop offset=".25" stop-color="#0b1424" stop-opacity="0"/>
      <stop offset=".8" stop-color="#0b1424" stop-opacity="0"/>
      <stop offset="1" stop-color="#0b1424" stop-opacity=".3"/>
    </linearGradient>
    <linearGradient id="topGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7390c0" stop-opacity=".9"/>
      <stop offset=".14" stop-color="#5f80b2" stop-opacity=".5"/>
      <stop offset=".3" stop-color="#4a6a9c" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="cloudLit">
      <stop offset="0" stop-color="#9bb3d4" stop-opacity=".9"/>
      <stop offset=".55" stop-color="#7b96bf" stop-opacity=".55"/>
      <stop offset="1" stop-color="#5a76a0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cloudShade">
      <stop offset="0" stop-color="#0e1a2f" stop-opacity=".55"/>
      <stop offset=".6" stop-color="#14233c" stop-opacity=".3"/>
      <stop offset="1" stop-color="#14233c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1000" height="1000" fill="url(#sky)"/>
  <rect width="1000" height="260" fill="url(#topGlow)"/>
<ellipse cx="520" cy="163.6" rx="260" ry="40.8" fill="url(#cloudShade)" opacity="0.81"/>
