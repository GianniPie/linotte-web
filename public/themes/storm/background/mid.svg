    <ellipse cx="567" cy="107" rx="258" ry="119" fill="url(#cloudMid)"/>
    <ellipse cx="558" cy="147" rx="274" ry="87" fill="url(#cloudMid)"/>
    <ellipse cx="580" cy="134" rx="196" ry="91" fill="url(#cloudMid)"/>
    <ellipse cx="332" cy="157" rx="247" ry="94" fill="url(#cloudMid)"/>
    <ellipse cx="660" cy="182" rx="194" ry="115" fill="url(#cloudMid)"/>
    <ellipse cx="519" cy="143" rx="172" ry="77" fill="url(#cloudMid)"/>
    <ellipse cx="791" cy="128" rx="150" ry="87" fill="url(#cloudDark)"/>
