<?xml version="1.0" encoding="UTF-8"?>
<!-- A layer of the storm background's clouds, still: three copies side by side (a period of 1000), so that it can be slid by one period with CSS and loop without a seam. It is drawn once and moved by the GPU (see .bg-fx in linotte.css). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3000 1000" preserveAspectRatio="none">
  <defs>
    <radialGradient id="cloudDark">
      <stop offset="0" stop-color="#142036" stop-opacity=".8"/>
      <stop offset=".6" stop-color="#1c2c48" stop-opacity=".42"/>
      <stop offset="1" stop-color="#243756" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cloudMid">
      <stop offset="0" stop-color="#22344f" stop-opacity=".8"/>
      <stop offset=".6" stop-color="#2a3e5c" stop-opacity=".4"/>
      <stop offset="1" stop-color="#334a6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cloudLight">
      <stop offset="0" stop-color="#a9bcd6" stop-opacity=".7"/>
      <stop offset=".6" stop-color="#8fa5c4" stop-opacity=".35"/>
      <stop offset="1" stop-color="#7f98ba" stop-opacity="0"/>
    </radialGradient>
    <g id="set">
    <ellipse cx="-100" cy="28" rx="150" ry="80" fill="url(#cloudMid)"/>
    <ellipse cx="-145" cy="117" rx="200" ry="83" fill="url(#cloudMid)"/>
    <ellipse cx="304" cy="55" rx="236" ry="71" fill="url(#cloudMid)"/>
    <ellipse cx="-129" cy="108" rx="153" ry="89" fill="url(#cloudMid)"/>
