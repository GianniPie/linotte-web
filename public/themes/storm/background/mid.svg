    <ellipse cx="172" cy="67" rx="184" ry="112" fill="url(#cloudMid)"/>
    <ellipse cx="87" cy="73" rx="201" ry="92" fill="url(#cloudMid)"/>
    <ellipse cx="456" cy="87" rx="178" ry="83" fill="url(#cloudDark)"/>
    <ellipse cx="353" cy="82" rx="124" ry="69" fill="url(#cloudDark)"/>
    <ellipse cx="345" cy="103" rx="142" ry="96" fill="url(#cloudDark)"/>
    <ellipse cx="348" cy="82" rx="222" ry="70" fill="url(#cloudDark)"/>
