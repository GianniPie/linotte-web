<?xml version="1.0" encoding="UTF-8"?>
<!-- Ice theme piece: a plump penguin seen from the front. A black dome head and body with a glossy shine, two white eye patches with big round eyes, a small orange beak, a big white belly, black flippers and orange feet. -->
<svg xmlns="http://www.w3.org/2000/svg" width="184" height="184" viewBox="12 10 176 176">
  <defs>
    <linearGradient id="black" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a3b44"/><stop offset=".4" stop-color="#1b1c24"/><stop offset="1" stop-color="#0b0c10"/></linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e3edf6"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffbe4d"/><stop offset="1" stop-color="#f29a1f"/></linearGradient>
  </defs>
  <!-- feet -->
  <g fill="url(#orange)" stroke="#1b1d26" stroke-width="3.5" stroke-linejoin="round">
    <path d="M58 176 Q60 164 76 166 Q92 168 90 178 Q74 184 58 176 Z"/>
    <path d="M110 178 Q108 168 124 166 Q140 164 142 176 Q126 184 110 178 Z"/>
  </g>
  <!-- flippers -->
  <g fill="url(#black)" stroke="#1b1d26" stroke-width="4" stroke-linejoin="round">
    <path d="M48 96 Q20 112 14 152 Q40 150 58 128 Z"/>
    <path d="M152 96 Q180 112 186 152 Q160 150 142 128 Z"/>
  </g>
  <!-- body and head: one dome -->
  <path d="M100 18 C62 18 42 52 42 94 C42 144 62 178 100 178 C138 178 158 144 158 94 C158 52 138 18 100 18 Z" fill="url(#black)" stroke="#1b1d26" stroke-width="4.5"/>
  <path d="M62 54 Q74 28 108 26" fill="none" stroke="#ffffff" stroke-opacity=".28" stroke-width="7" stroke-linecap="round"/>
  <!-- belly -->
  <path d="M100 104 C70 106 56 132 58 152 C60 170 76 176 100 176 C124 176 140 170 142 152 C144 132 130 106 100 104 Z" fill="url(#belly)"/>
  <!-- the white face: two round patches that join -->
  <g fill="#ffffff">
    <circle cx="77" cy="78" r="29"/><circle cx="123" cy="78" r="29"/><ellipse cx="100" cy="92" rx="24" ry="19"/>
  </g>
  <!-- eyes -->
  <circle cx="79" cy="81" r="11" fill="#1b1d26"/><circle cx="121" cy="81" r="11" fill="#1b1d26"/>
  <circle cx="83" cy="77" r="3.6" fill="#fff"/><circle cx="125" cy="77" r="3.6" fill="#fff"/>
  <circle cx="75" cy="85" r="1.5" fill="#fff" opacity=".8"/><circle cx="117" cy="85" r="1.5" fill="#fff" opacity=".8"/>
  <!-- beak -->
  <path d="M86 94 Q100 86 114 94 Q108 108 100 110 Q92 108 86 94 Z" fill="url(#orange)" stroke="#d27812" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M92 95 Q100 91 108 95" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="2" stroke-linecap="round"/>
</svg>
