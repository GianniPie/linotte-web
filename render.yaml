# The online game server on Render (https://render.com).
# Create it once with Render's "New > Blueprint" on this repository; Render
# then redeploys it on every push to main.
#
# Scaling, in order:
#  1. now: plan "free". It sleeps after 15 minutes without traffic (about a
#     minute to wake); .github/workflows/keep-server-awake.yml pings it every
#     10 minutes so it doesn't, within the free 750 hours a month.
#  2. more players: change "plan" to "starter" (always on, more CPU), then
#     "standard" -- no code change.
#  3. more than one instance: add the Socket.IO Redis adapter first (rooms
#     live in memory, one server only; linotte-kv below is already there),
#     then raise numInstances.
services:
  - type: web
    # The existing service, https://linotte-web.onrender.com (Virginia). Its
    # address must match public/config.js and the GAME_SERVER_URL repository
    # variable. Render can't move a service between regions: a Frankfurt one
    # would be a new service with a new address.
    name: linotte-web
    runtime: node
    plan: free
    region: virginia
    branch: server-node # the branch the existing service deploys from
    buildCommand: npm install --omit=dev
    startCommand: node server/server.js
    healthCheckPath: /healthz
    autoDeploy: true
    # Restart the server only when the server changes: a deploy restarts it,
    # and a release that only touches the web app (on Vercel) doesn't need to.
    # (On the hand-made service this is set in Settings > Build Filters.)
    buildFilter:
      paths:
        - server/**
        - public/shared/**
        - package.json
        - package-lock.json
    envVars:
      - key: NODE_ENV
        value: production
      # The published web client. The native apps' origins are always allowed
      # (see isOriginAllowed in server/config.js).
      - key: ALLOWED_ORIGINS
        value: https://linotte-web.vercel.app
      # Secrets, set by hand in the dashboard (Environment), never in this file:
      # SUPABASE_SECRET_KEY records online games for the Stats screen
      # (server/results.js); REVENUECAT_SECRET_KEY decides who is Pro.
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: REVENUECAT_SECRET_KEY
        sync: false
      # Where games are saved so a restart (every deploy) doesn't end them.
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: linotte-kv
          property: connectionString

  # The game store (server/store.js): a copy of every game in progress.
  - type: keyvalue
    name: linotte-kv
    plan: free
    region: virginia # must be the server's region
    maxmemoryPolicy: allkeys-lru
    ipAllowList: [] # reachable only from services in this account
